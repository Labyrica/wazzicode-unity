# Desktop app release (apps/desktop) through the shared Labyrica workflow.
# Push a tag vX.Y.Z matching apps/desktop/src-tauri/tauri.conf.json "version".
# CLI/addon source releases use cli-vX.Y.Z tags and never trigger this.
# See https://github.com/Labyrica/.github/blob/main/RELEASING.md
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: Labyrica/.github/.github/workflows/tauri-release.yml@v1
    with:
      app-name: "Foundry for Unity"
      releases-repo: Labyrica/foundry-unity-releases
      project-path: apps/desktop
      package-manager: pnpm
      # Build the workspace (apps/cli/dist), then fetch the Node sidecar for this
      # target, bundle the CLI + engine package, and vendor the offline dictation model.
      prepare: |
        set -euo pipefail
        pnpm build
        cd apps/desktop
        node scripts/fetch-node-sidecar.mjs --target "$TARGET"
        node scripts/bundle-uvibe.mjs
        node scripts/fetch-whisper.mjs
      tauri-args: --config src-tauri/tauri.bundle.conf.json
      linux: true
    secrets: inherit
